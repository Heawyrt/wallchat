<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallchat</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #b83bde, #3558d0);
      --bg-color: #0a0e14;
      --panel-bg: #121921;
      --border-color: #1e2631;
      --text-color: #ffffff;
      --msg-out: #3558d0;
      --msg-in: #182533;
      --input-bg: #1d2633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .app-main-title { background: var(--primary-gradient); padding: 8px; text-align: center; font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .app-container { width: 100%; max-width: 1100px; height: 100%; margin: 0 auto; background: var(--panel-bg); display: none; overflow: hidden; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
    .app-container.active { display: flex; }

    .sidebar { width: 320px; background: #0c1218; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .nav-tabs { display: flex; background: #090d11; border-bottom: 1px solid var(--border-color); }
    .nav-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #8e949a; }
    .nav-tab.active { color: #fff; border-bottom: 2px solid #b83bde; }
    .tab-content { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

    .chat-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1a232f; }
    .chat-item .name { font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .admin-badge { display: inline-flex; align-items: center; color: #b83bde; margin-left: 2px; }
    .admin-badge svg { width: 14px; height: 14px; fill: currentColor; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #3558d0; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .founder-badge { font-size: 0.7rem; color: #b83bde; background: rgba(184, 59, 222, 0.15); padding: 2px 6px; border-radius: 4px; font-weight: normal; margin-left: 4px; }

    .chat-main { flex: 1; display: flex; flex-direction: column; background: #0f151c; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; font-weight: bold; background: #0c1218; }
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message-row { display: flex; gap: 8px; align-items: flex-end; }
    .message-bubble { max-width: 65%; padding: 10px 14px; border-radius: 12px; background: var(--msg-in); word-break: break-word; }
    .message-row.sent { flex-direction: row-reverse; }
    .message-row.sent .message-bubble { background: var(--msg-out); }
    .input-area { display: flex; align-items: center; padding: 12px; gap: 8px; border-top: 1px solid var(--border-color); background: #0c1218; }
    
    input, button { padding: 10px 14px; border: none; border-radius: 8px; outline: none; }
    input { background: var(--input-bg); color: #fff; flex: 1; }
    button { background: var(--primary-gradient); color: #fff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #242f3d; }

    .auth-screen, .modal { display: none; width: 100%; max-width: 450px; background: var(--panel-bg); padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: absolute; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%); flex-direction: column; gap: 14px; }
    .auth-screen.active, .modal.active { display: flex; }
    .overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 9; }
    .overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="app-main-title">wallchat</div>
  <div id="overlay" class="overlay"></div>

  <!-- Авторизация -->
  <div id="authScreen" class="auth-screen active">
    <h2 style="text-align:center;">Вход в Wallchat</h2>
    <div style="display:flex; gap:8px;">
      <button id="tabLogin" style="flex:1" onclick="switchAuthTab('login')">Вход</button>
      <button id="tabReg" style="flex:1" class="secondary" onclick="switchAuthTab('reg')">Регистрация</button>
    </div>
    <input type="text" id="authName" placeholder="Имя пользователя">
    <input type="password" id="authPass" placeholder="Пароль">
    
    <div id="regBirthdayBox" style="display:none">
      <label style="font-size:0.85rem; color:#8e949a; margin-bottom:4px; display:block">Дата рождения</label>
      <input type="date" id="authBirthday" style="width:100%">
    </div>

    <button onclick="submitAuth()">Продолжить</button>
  </div>

  <!-- Настройки -->
  <div id="settingsModal" class="modal">
    <h2>Настройки профиля</h2>
    <div>
      <label style="font-size:0.85rem; color:#8e949a;">Дата рождения</label>
      <input type="date" id="setBirthday" style="width:100%; margin-top:4px;">
    </div>
    <input type="password" id="setPass" placeholder="Новый пароль (опционально)">
    <button onclick="saveSettings()">Сохранить</button>
    <button class="secondary" onclick="toggleModal('settingsModal', false)">Закрыть</button>
    <button class="secondary" style="background:#d32f2f" onclick="logout()">Выйти</button>
  </div>

  <!-- Управление группой -->
  <div id="groupSettingsModal" class="modal" style="max-width: 500px;">
    <h2>Управление группой</h2>
    <input type="text" id="groupSetNameInput" placeholder="Название группы">
    <div style="font-size:0.9rem; margin-top:6px;">Участники:</div>
    <div id="groupMembersList" style="max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; border: 1px solid var(--border-color); padding: 8px; border-radius: 8px;"></div>
    
    <div id="groupFounderActions" style="display:none; flex-direction:column; gap:8px; margin-top:10px; border-top: 1px solid var(--border-color); padding-top:10px;">
      <div style="font-size:0.9rem;">Пригласить друзей:</div>
      <div id="groupInviteChecklist" style="max-height:100px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
      <button onclick="submitGroupSettings()">Сохранить изменения</button>
      <button class="secondary" style="background:#d32f2f; margin-top:8px;" onclick="deleteGroup()">УДАЛИТЬ ГРУППУ</button>
    </div>

    <button id="groupLeaveBtn" class="secondary" style="background:#d32f2f; margin-top:10px;" onclick="leaveGroup()">Покинуть группу</button>
    <button class="secondary" onclick="toggleModal('groupSettingsModal', false)">Закрыть</button>
  </div>

  <!-- Главный экран -->
  <div id="appContainer" class="app-container">
    <div class="sidebar">
      <div style="padding: 14px; border-bottom: 1px solid var(--border-color); display:flex; justify-content: space-between; align-items:center">
        <div onclick="toggleModal('settingsModal', true)" style="display:flex; align-items:center; gap:8px; font-weight:bold; cursor:pointer">
          <div id="myAvatar" class="avatar" style="width:32px; height:32px; font-size:0.8rem;"></div>
          <span id="myName"></span>
        </div>
        <button class="secondary" style="padding:6px 10px; font-size:0.8rem;" onclick="toggleModal('settingsModal', true)">⚙</button>
      </div>

      <div class="nav-tabs">
        <div id="tabChatsBtn" class="nav-tab active" onclick="switchSidebarTab('chats')">Чаты</div>
        <div id="tabFriendsBtn" class="nav-tab" onclick="switchSidebarTab('friends')">Друзья</div>
      </div>

      <div id="chatsTab" class="tab-content">
        <div class="chat-item" onclick="openSavedMessagesChat()">
          <div class="avatar" style="background:#b83bde; font-size:1.2rem;">🔖</div>
          <div class="info">
            <div class="name">Избранное</div>
            <div style="font-size:0.75rem; color:#8e949a;">Личные сообщения</div>
          </div>
        </div>
        <div id="chatsList"></div>
      </div>

      <div id="friendsTab" class="tab-content" style="display:none;">
        <div style="display:flex; gap:6px;">
          <input type="text" id="friendSearchInput" placeholder="Имя пользователя">
          <button style="padding:6px 10px;" onclick="sendFriendRequest()">+</button>
        </div>
        <div id="friendsList"></div>
      </div>
    </div>

    <div class="chat-main">
      <div id="chatHeader" class="chat-header" style="display:none;">
        <div id="activeChatAvatar" class="avatar" style="width:36px; height:36px;"></div>
        <div style="flex:1;">
          <div id="activeChatName" style="display:flex; align-items:center; gap:4px;"></div>
        </div>
        <button id="activeGroupSettingsBtn" class="secondary" style="padding: 6px 10px; display:none" onclick="openGroupSettingsModal()">⚙ Управление</button>
      </div>

      <div id="messagesArea" class="messages-area">
        <div style="text-align:center; color:#8e949a; margin-top:auto;">Выберите чат для начала общения</div>
      </div>

      <div id="inputArea" class="input-area" style="display:none;">
        <input type="text" id="msgInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let authMode = 'login';
    let currentUser = null;
    let activeChat = null;
    let myData = { friends: [] };

    const adminCheckmarkSVG = `<span class="admin-badge" title="Администратор"><svg viewBox="0 0 24 24"><path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 9z"/></svg></span>`;

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tabLogin').className = mode === 'login' ? '' : 'secondary';
      document.getElementById('tabReg').className = mode === 'reg' ? '' : 'secondary';
      document.getElementById('regBirthdayBox').style.display = mode === 'reg' ? 'block' : 'none';
    }

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('active', show);
      document.getElementById('overlay').classList.toggle('active', show);
    }

    async function submitAuth() {
      const username = document.getElementById('authName').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const birthday = document.getElementById('authBirthday').value;

      if (!username || !password) return alert('Заполните поля!');
      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
      
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, birthday })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || 'Ошибка входа');

      currentUser = data;
      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('appContainer').classList.add('active');
      document.getElementById('myName').innerText = data.username;
      document.getElementById('myAvatar').innerText = data.username[0].toUpperCase();
      
      loadMyData();
    }

    function logout() {
      location.reload();
    }

    async function saveSettings() {
      const birthday = document.getElementById('setBirthday').value;
      const newPassword = document.getElementById('setPass').value;
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ birthday, newPassword })
      });
      if (res.ok) {
        alert('Настройки сохранены');
        toggleModal('settingsModal', false);
      }
    }

    function switchSidebarTab(tab) {
      document.getElementById('chatsTab').style.display = tab === 'chats' ? 'flex' : 'none';
      document.getElementById('friendsTab').style.display = tab === 'friends' ? 'flex' : 'none';
      document.getElementById('tabChatsBtn').className = `nav-tab ${tab === 'chats' ? 'active' : ''}`;
      document.getElementById('tabFriendsBtn').className = `nav-tab ${tab === 'friends' ? 'active' : ''}`;
    }

    function openSavedMessagesChat() {
      openChat({ type: 'saved', id: 'saved', name: 'Избранное' });
    }

    function openChat(chat) {
      activeChat = chat;
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('activeChatName').innerHTML = chat.name;
      document.getElementById('activeChatAvatar').innerText = chat.name[0].toUpperCase();
      
      document.getElementById('activeGroupSettingsBtn').style.display = chat.type === 'group' ? 'block' : 'none';

      socket.emit('join_room', { token: currentUser.token, chatType: chat.type, targetId: chat.id });
    }

    async function openGroupSettingsModal() {
      if (!activeChat || activeChat.type !== 'group') return;
      const res = await fetch(`/api/groups/${activeChat.id}`, { headers: { 'Authorization': `Bearer ${currentUser.token}` } });
      const groupData = await res.json();
      
      document.getElementById('groupSetNameInput').value = groupData.name;
      const membersList = document.getElementById('groupMembersList');
      membersList.innerHTML = '';

      groupData.members.forEach(m => {
        const item = document.createElement('div');
        item.style.display = 'flex'; item.style.justifyContent = 'space-between'; item.style.alignItems = 'center';
        const founderBadge = m.status === 'founder' ? '<span class="founder-badge">Founder</span>' : '';
        const removeBtn = (groupData.isFounder && m.status !== 'founder') ? `<button class="secondary" style="padding:2px 6px; font-size:0.7rem; background:#4e1919" onclick="removeMemberFromGroup('${m.username}')">✕</button>` : '';
        item.innerHTML = `<span>${m.username} ${m.isAdmin ? adminCheckmarkSVG : ''} ${founderBadge}</span>${removeBtn}`;
        membersList.appendChild(item);
      });

      const founderActions = document.getElementById('groupFounderActions');
      const leaveBtn = document.getElementById('groupLeaveBtn');
      
      if (groupData.isFounder) {
        founderActions.style.display = 'flex';
        leaveBtn.style.display = 'none';
      } else {
        founderActions.style.display = 'none';
        leaveBtn.style.display = 'block';
      }

      toggleModal('groupSettingsModal', true);
    }

    async function submitGroupSettings() {
      const name = document.getElementById('groupSetNameInput').value;
      const res = await fetch('/api/groups/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ groupId: activeChat.id, name })
      });
      if (res.ok) {
        toggleModal('groupSettingsModal', false);
        alert('Обновлено');
      }
    }

    async function leaveGroup() {
      if (!confirm('Покинуть группу?')) return;
      await fetch('/api/groups/leave', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ groupId: activeChat.id })
      });
      toggleModal('groupSettingsModal', false);
      location.reload();
    }

    async function deleteGroup() {
      if (!confirm('Удалить группу безвозвратно?')) return;
      await fetch('/api/groups/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ groupId: activeChat.id })
      });
      toggleModal('groupSettingsModal', false);
      location.reload();
    }

    async function removeMemberFromGroup(username) {
      await fetch('/api/groups/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ groupId: activeChat.id, removeMembers: [username] })
      });
      openGroupSettingsModal();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !activeChat) return;

      socket.emit('send_message', { token: currentUser.token, chatType: activeChat.type, targetId: activeChat.id, text });
      input.value = '';
    }

    socket.on('chat_history', (msgs) => {
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';
      msgs.forEach(renderMessage);
    });

    socket.on('new_message', (msg) => {
      renderMessage(msg);
    });

    function renderMessage(msg) {
      const area = document.getElementById('messagesArea');
      const isMe = msg.sender === currentUser.username;
      const row = document.createElement('div');
      row.className = `message-row ${isMe ? 'sent' : ''}`;
      
      const adminBadge = msg.isAdmin ? adminCheckmarkSVG : '';
      row.innerHTML = `
        <div class="message-bubble">
          <div style="font-size:0.75rem; color:#8e949a; margin-bottom:2px;">${msg.sender} ${adminBadge}</div>
          <div>${msg.text}</div>
        </div>
      `;
      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    async function loadMyData() {
      // Инициализация при входе
    }
  </script>
</body>
</html>
