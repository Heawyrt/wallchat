<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallchat</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #b83bde, #3558d0);
      --bg-color: #0e1621;
      --panel-bg: #17212b;
      --border-color: #242f3d;
      --text-color: #ffffff;
      --msg-out: #3558d0;
      --msg-in: #182533;
      --input-bg: #242f3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; justify-content: center; align-items: center; }

    /* Экраны Авторизации и Настроек */
    .auth-screen, .modal { display: none; width: 100%; max-width: 450px; background: var(--panel-bg); padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: absolute; z-index: 10; }
    .auth-screen.active, .modal.active { display: flex; flex-direction: column; gap: 14px; }

    /* Главное окно приложения */
    .app-container { width: 100%; max-width: 1000px; height: 92vh; background: var(--panel-bg); border-radius: 12px; display: none; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .app-container.active { display: flex; }

    /* Сайдбар слева */
    .sidebar { width: 320px; background: #121921; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { background: var(--primary-gradient); padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }

    .nav-tabs { display: flex; background: #0e1621; border-bottom: 1px solid var(--border-color); }
    .nav-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #8e949a; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: #fff; border-bottom-color: #b83bde; }

    .tab-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .chat-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .chat-item:hover, .chat-item.active { background: #242f3d; }
    .chat-item .info { flex: 1; overflow: hidden; }
    .chat-item .name { font-weight: bold; display: flex; align-items: center; gap: 4px; }

    /* Значок галочки администратора */
    .admin-badge { display: inline-flex; align-items: center; color: #b83bde; }
    .admin-badge svg { width: 16px; height: 16px; }

    /* Аватарка */
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #3558d0; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }

    /* Область чата справа */
    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--panel-bg); }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; font-weight: bold; background: #121921; }
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .message-row { display: flex; gap: 8px; align-items: flex-end; }
    .message-row.sent { flex-direction: row-reverse; }
    .message-bubble { max-width: 65%; padding: 10px 14px; border-radius: 12px; word-break: break-word; background: var(--msg-in); }
    .message-row.sent .message-bubble { background: var(--msg-out); }
    .message-sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; color: #a2b4c7; }
    .message-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 6px; display: block; }
    .message-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 4px; }

    /* Панель ввода */
    .input-area { display: flex; align-items: center; padding: 12px; background: #0e1621; gap: 8px; border-top: 1px solid var(--border-color); }
    input, button { padding: 10px 14px; border: none; border-radius: 8px; outline: none; }
    input { background: var(--input-bg); color: #fff; flex: 1; }
    button { background: var(--primary-gradient); color: #fff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #242f3d; }
    .photo-btn { cursor: pointer; padding: 8px 12px; background: #242f3d; border-radius: 8px; font-size: 1.2rem; }

    /* Превью фото перед отправкой */
    .img-preview-bar { display: none; padding: 8px; background: #121921; align-items: center; gap: 10px; }
    .img-preview-bar img { height: 50px; border-radius: 6px; }

    .empty-chat-state { flex: 1; display: flex; justify-content: center; align-items: center; color: #8e949a; }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="authScreen" class="auth-screen active">
    <h2 style="text-align:center; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Wallchat</h2>
    <div style="display:flex; gap:8px;">
      <button id="tabLogin" style="flex:1" onclick="switchAuthTab('login')">Вход</button>
      <button id="tabReg" style="flex:1" class="secondary" onclick="switchAuthTab('reg')">Регистрация</button>
    </div>
    <div id="regAvatarBox" style="display:none; text-align:center;">
      <label for="regAvatarInput" style="cursor:pointer;">
        <img id="regAvatarPreview" class="avatar" style="width:70px; height:70px; margin:auto;" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="+">
        <div style="font-size:0.8rem; color:#b83bde; margin-top:4px;">Выбрать аватар из галереи</div>
      </label>
      <input type="file" id="regAvatarInput" accept="image/*" style="display:none" onchange="loadPreview(this, 'regAvatarPreview')">
    </div>
    <input type="text" id="authName" placeholder="Имя пользователя">
    <input type="password" id="authPass" placeholder="Пароль">
    <button onclick="submitAuth()">Продолжить</button>
  </div>

  <!-- Окно Настроек -->
  <div id="settingsModal" class="modal">
    <h2>Настройки профиля</h2>
    <div style="text-align:center;">
      <label for="setAvatarInput" style="cursor:pointer;">
        <img id="setAvatarPreview" class="avatar" style="width:80px; height:80px; margin:auto;" src="" alt="Avatar">
        <div style="font-size:0.85rem; color:#b83bde; margin-top:4px;">Сменить аватар</div>
      </label>
      <input type="file" id="setAvatarInput" accept="image/*" style="display:none" onchange="loadPreview(this, 'setAvatarPreview')">
    </div>
    <input type="password" id="setPass" placeholder="Новый пароль (опционально)">
    <button onclick="saveSettings()">Сохранить</button>
    <button class="secondary" onclick="toggleModal('settingsModal', false)">Закрыть</button>
    <button class="secondary" style="background:#d32f2f" onclick="logout()">Выйти</button>
  </div>

  <!-- Модальное окно создания группы -->
  <div id="createGroupModal" class="modal">
    <h2>Создать группу</h2>
    <input type="text" id="groupNameInput" placeholder="Название группы">
    <div style="font-size:0.9rem; margin-top:6px;">Выберите друзей для добавления:</div>
    <div id="friendsChecklist" style="max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
    <button onclick="submitCreateGroup()">Создать чат</button>
    <button class="secondary" onclick="toggleModal('createGroupModal', false)">Отмена</button>
  </div>

  <!-- Главный интерфейс мессенджера -->
  <div id="appContainer" class="app-container">
    <!-- Сайдбар -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-info" onclick="toggleModal('settingsModal', true)">
          <img id="myAvatar" class="avatar" style="width:32px; height:32px; display:none;">
          <div id="myAvatarText" class="avatar" style="width:32px; height:32px;">U</div>
          <span id="myName">User</span>
          <span id="myAdminBadge"></span>
        </div>
        <button class="secondary" style="padding:6px 10px; font-size:0.8rem;" onclick="toggleModal('settingsModal', true)">⚙</button>
      </div>

      <div class="nav-tabs">
        <div id="tabChatsBtn" class="nav-tab active" onclick="switchSidebarTab('chats')">Чаты</div>
        <div id="tabFriendsBtn" class="nav-tab" onclick="switchSidebarTab('friends')">Друзья</div>
      </div>

      <!-- Вкладка: Список чатов -->
      <div id="chatsTab" class="tab-content">
        <div style="font-size:0.8rem; color:#8e949a; margin:4px 0;">ЛИЧНЫЕ ЧАТЫ И ГРУППЫ</div>
        <div id="chatsList"></div>
      </div>

      <!-- Вкладка: Друзья и заявки -->
      <div id="friendsTab" class="tab-content" style="display:none;">
        <div style="display:flex; gap:6px;">
          <input type="text" id="addFriendName" placeholder="Никнейм друга" style="font-size:0.85rem;">
          <button onclick="sendFriendRequest()" style="padding:8px 12px;">+</button>
        </div>
        
        <button onclick="openCreateGroupModal()" style="margin-top:6px;" class="secondary">+ Создать группу</button>

        <div style="font-size:0.8rem; color:#8e949a; margin-top:10px;">ЗАЯВКИ В ДРУЗЬЯ</div>
        <div id="requestsList"></div>

        <div style="font-size:0.8rem; color:#8e949a; margin-top:10px;">МОИ ДРУЗЬЯ</div>
        <div id="friendsList"></div>
      </div>
    </div>

    <!-- Основной чат -->
    <div class="chat-main">
      <div id="chatHeader" class="chat-header" style="display:none;">
        <div id="activeChatAvatar" class="avatar">C</div>
        <div style="flex:1;">
          <div id="activeChatName" style="display:flex; align-items:center; gap:4px;">Выберите чат</div>
          <div id="activeChatSub" style="font-size:0.75rem; color:#8e949a; font-weight:normal;"></div>
        </div>
      </div>

      <div id="emptyState" class="empty-chat-state">
        Выберите друга или группу из списка слева для начала общения
      </div>

      <div id="messagesArea" class="messages-area" style="display:none;"></div>

      <div id="imgPreviewBar" class="img-preview-bar">
        <img id="imgPreview" src="" alt="preview">
        <span style="font-size:0.85rem; flex:1;">Изображение готово к отправке</span>
        <button class="secondary" onclick="cancelImage()" style="padding:4px 8px;">✕</button>
      </div>

      <form id="chatForm" class="input-area" style="display:none;" onsubmit="handleSendMsg(event)">
        <label class="photo-btn" title="Отправить фото">
          📷
          <input type="file" id="msgPhotoInput" accept="image/*" style="display:none;" onchange="handleMsgPhoto(this)">
        </label>
        <input type="text" id="msgInput" placeholder="Напишите сообщение..." autocomplete="off">
        <button type="submit">Отправить</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let authMode = 'login';
    let currentUser = JSON.parse(localStorage.getItem('wallchat_user') || 'null');
    let tempAvatarBase64 = '';
    let selectedImageBase64 = null;

    let activeChat = null; // { type: 'dm'|'group', id: string, name: string, avatar: string, isAdmin: bool }
    let myData = { friends: [], friendRequests: [], groups: [] };

    const adminCheckmarkSVG = `<span class="admin-badge" title="Администратор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 1.8 3-.4.8 2.9 2.8 1.2-.8 2.9.8 2.9-2.8 1.2-.8 2.9-3-.4L12 22l-2.4-1.8-3 .4-.8-2.9-2.8-1.2.8-2.9-.8-2.9 2.8-1.2.8-2.9 3 .4L12 2z" fill="#3558d0" stroke="#b83bde" stroke-width="1.5"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></span>`;

    function toggleModal(id, show) {
      const modal = document.getElementById(id);
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('regAvatarBox').style.display = mode === 'reg' ? 'block' : 'none';
      document.getElementById('tabLogin').className = mode === 'login' ? '' : 'secondary';
      document.getElementById('tabReg').className = mode === 'reg' ? '' : 'secondary';
    }

    function loadPreview(input, imgId) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById(imgId).src = e.target.result;
          tempAvatarBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function submitAuth() {
      const username = document.getElementById('authName').value.trim();
      const password = document.getElementById('authPass').value.trim();
      if (!username || !password) return alert('Заполните все поля');

      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
      const body = { username, password, avatar: authMode === 'reg' ? tempAvatarBase64 : undefined };

      const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();

      if (res.ok) {
        currentUser = data;
        localStorage.setItem('wallchat_user', JSON.stringify(data));
        initApp();
      } else {
        alert(data.error);
      }
    }

    async function loadMyData() {
      if (!currentUser) return;
      const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${currentUser.token}` } });
      if (res.ok) {
        myData = await res.json();
        renderSidebar();
      } else {
        logout();
      }
    }

    function renderSidebar() {
      // Мой профиль
      document.getElementById('myName').textContent = currentUser.username;
      document.getElementById('myAdminBadge').innerHTML = currentUser.isAdmin ? adminCheckmarkSVG : '';
      if (currentUser.avatar) {
        document.getElementById('myAvatar').src = currentUser.avatar;
        document.getElementById('myAvatar').style.display = 'block';
        document.getElementById('myAvatarText').style.display = 'none';
      } else {
        document.getElementById('myAvatarText').textContent = currentUser.username[0].toUpperCase();
        document.getElementById('myAvatarText').style.display = 'flex';
        document.getElementById('myAvatar').style.display = 'none';
      }

      // Список чатов (Друзья + Группы)
      const chatsList = document.getElementById('chatsList');
      chatsList.innerHTML = '';

      // Личные чаты (Друзья)
      myData.friends.forEach(f => {
        const item = document.createElement('div');
        item.className = `chat-item ${activeChat?.id === f.username ? 'active' : ''}`;
        item.onclick = () => openChat({ type: 'dm', id: f.username, name: f.username, avatar: f.avatar, isAdmin: f.isAdmin });
        
        const avatarHTML = f.avatar 
          ? `<img class="avatar" src="${f.avatar}">`
          : `<div class="avatar">${f.username[0].toUpperCase()}</div>`;

        item.innerHTML = `
          ${avatarHTML}
          <div class="info">
            <div class="name">${f.username} ${f.isAdmin ? adminCheckmarkSVG : ''}</div>
            <div style="font-size:0.75rem; color:#8e949a;">Личные сообщения</div>
          </div>
        `;
        chatsList.appendChild(item);
      });

      // Групповые чаты
      myData.groups.forEach(g => {
        const item = document.createElement('div');
        item.className = `chat-item ${activeChat?.id === g.id ? 'active' : ''}`;
        item.onclick = () => openChat({ type: 'group', id: g.id, name: g.name, avatar: null });

        item.innerHTML = `
          <div class="avatar" style="background:#b83bde;">👥</div>
          <div class="info">
            <div class="name">${g.name}</div>
            <div style="font-size:0.75rem; color:#8e949a;">Участников: ${g.members.length}</div>
          </div>
        `;
        chatsList.appendChild(item);
      });

      // Заявки в друзья
      const reqList = document.getElementById('requestsList');
      reqList.innerHTML = myData.friendRequests.length === 0 ? '<div style="font-size:0.8rem; color:#666;">Нет новых заявок</div>' : '';
      myData.friendRequests.forEach(r => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.innerHTML = `
          <div class="info">
            <div class="name">${r.username} ${r.isAdmin ? adminCheckmarkSVG : ''}</div>
          </div>
          <button onclick="acceptRequest('${r.username}')" style="padding:4px 8px; font-size:0.75rem;">✓</button>
          <button onclick="rejectRequest('${r.username}')" class="secondary" style="padding:4px 8px; font-size:0.75rem;">✕</button>
        `;
        reqList.appendChild(item);
      });

      // Список друзей во вкладке Друзья
      const fList = document.getElementById('friendsList');
      fList.innerHTML = myData.friends.length === 0 ? '<div style="font-size:0.8rem; color:#666;">Список друзей пуст</div>' : '';
      myData.friends.forEach(f => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => { switchSidebarTab('chats'); openChat({ type: 'dm', id: f.username, name: f.username, avatar: f.avatar, isAdmin: f.isAdmin }); };
        item.innerHTML = `
          <div class="name">${f.username} ${f.isAdmin ? adminCheckmarkSVG : ''}</div>
        `;
        fList.appendChild(item);
      });
    }

    function switchSidebarTab(tab) {
      document.getElementById('chatsTab').style.display = tab === 'chats' ? 'flex' : 'none';
      document.getElementById('friendsTab').style.display = tab === 'friends' ? 'flex' : 'none';
      document.getElementById('tabChatsBtn').className = `nav-tab ${tab === 'chats' ? 'active' : ''}`;
      document.getElementById('tabFriendsBtn').className = `nav-tab ${tab === 'friends' ? 'active' : ''}`;
    }

    async function sendFriendRequest() {
      const name = document.getElementById('addFriendName').value.trim();
      if (!name) return;

      const res = await fetch('/api/friends/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ targetUsername: name })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) {
        document.getElementById('addFriendName').value = '';
        loadMyData();
      }
    }

    async function acceptRequest(requesterUsername) {
      const res = await fetch('/api/friends/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ requesterUsername })
      });
      if (res.ok) loadMyData();
    }

    async function rejectRequest(requesterUsername) {
      await fetch('/api/friends/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ requesterUsername })
      });
      loadMyData();
    }

    function openCreateGroupModal() {
      const checklist = document.getElementById('friendsChecklist');
      checklist.innerHTML = myData.friends.length === 0 ? 'Сначала добавьте друзей' : '';
      myData.friends.forEach(f => {
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.gap = '8px';
        label.innerHTML = `<input type="checkbox" value="${f.username}"> ${f.username}`;
        checklist.appendChild(label);
      });
      toggleModal('createGroupModal', true);
    }

    async function submitCreateGroup() {
      const groupName = document.getElementById('groupNameInput').value.trim();
      if (!groupName) return alert('Введите название группы');

      const checked = Array.from(document.querySelectorAll('#friendsChecklist input:checked')).map(cb => cb.value);

      const res = await fetch('/api/groups/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ groupName, memberUsernames: checked })
      });
      const data = await res.json();
      if (res.ok) {
        toggleModal('createGroupModal', false);
        document.getElementById('groupNameInput').value = '';
        await loadMyData();
        openChat({ type: 'group', id: data.group.id, name: data.group.name });
      } else {
        alert(data.error);
      }
    }

    function openChat(chat) {
      activeChat = chat;
      renderSidebar();

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('messagesArea').style.display = 'flex';
      document.getElementById('chatForm').style.display = 'flex';

      document.getElementById('activeChatName').innerHTML = `${chat.name} ${chat.isAdmin ? adminCheckmarkSVG : ''}`;
      document.getElementById('activeChatSub').textContent = chat.type === 'dm' ? 'Личный чат' : 'Групповой чат';

      const avatarHeader = document.getElementById('activeChatAvatar');
      if (chat.avatar) {
        avatarHeader.outerHTML = `<img id="activeChatAvatar" class="avatar" src="${chat.avatar}">`;
      } else {
        avatarHeader.outerHTML = `<div id="activeChatAvatar" class="avatar">${chat.name[0].toUpperCase()}</div>`;
      }

      document.getElementById('messagesArea').innerHTML = '';

      // Подключиться к комнате через socket
      socket.emit('join_room', { token: currentUser.token, chatType: chat.type, targetId: chat.id });
    }

    function handleMsgPhoto(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          selectedImageBase64 = e.target.result;
          document.getElementById('imgPreview').src = selectedImageBase64;
          document.getElementById('imgPreviewBar').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    }

    function cancelImage() {
      selectedImageBase64 = null;
      document.getElementById('imgPreviewBar').style.display = 'none';
      document.getElementById('msgPhotoInput').value = '';
    }

    function handleSendMsg(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();

      if ((text || selectedImageBase64) && activeChat) {
        socket.emit('send_message', {
          token: currentUser.token,
          chatType: activeChat.type,
          targetId: activeChat.id,
          text: text,
          image: selectedImageBase64
        });

        input.value = '';
        cancelImage();
      }
    }

    socket.on('chat_history', (history) => {
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('new_message', (msg) => {
      appendMessage(msg);
    });

    socket.on('error_msg', (data) => alert(data.error));

    function appendMessage(msg) {
      const area = document.getElementById('messagesArea');
      const isMe = msg.sender === currentUser.username;

      const row = document.createElement('div');
      row.className = `message-row ${isMe ? 'sent' : 'received'}`;

      const avatarHTML = msg.avatar 
        ? `<img class="avatar" style="width:30px; height:30px;" src="${msg.avatar}">`
        : `<div class="avatar" style="width:30px; height:30px; font-size:0.8rem;">${msg.sender[0].toUpperCase()}</div>`;

      const imgHTML = msg.image ? `<img class="message-img" src="${msg.image}">` : '';

      row.innerHTML = `
        ${avatarHTML}
        <div class="message-bubble">
          <div class="message-sender">${msg.sender} ${msg.isAdmin ? adminCheckmarkSVG : ''}</div>
          <div>${msg.text}</div>
          ${imgHTML}
          <div class="message-time">${msg.time}</div>
        </div>
      `;

      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    async function saveSettings() {
      const newPassword = document.getElementById('setPass').value.trim();
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}` },
        body: JSON.stringify({ avatar: tempAvatarBase64 || currentUser.avatar, newPassword })
      });
      if (res.ok) {
        const data = await res.json();
        currentUser.avatar = data.avatar;
        localStorage.setItem('wallchat_user', JSON.stringify(currentUser));
        toggleModal('settingsModal', false);
        loadMyData();
      }
    }

    function logout() {
      localStorage.removeItem('wallchat_user');
      currentUser = null;
      document.getElementById('appContainer').classList.remove('active');
      document.getElementById('authScreen').classList.add('active');
      toggleModal('settingsModal', false);
    }

    function initApp() {
      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('appContainer').classList.add('active');
      loadMyData();
    }

    if (currentUser) initApp();
  </script>
</body>
</html>
