<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallchat</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #b83bde, #3558d0);
      --bg-color: #0e1621;
      --panel-bg: #17212b;
      --text-color: #ffffff;
      --msg-out: #3558d0;
      --msg-in: #182533;
      --input-bg: #242f3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; justify-content: center; align-items: center; }
    
    .screen { display: none; width: 100%; max-width: 450px; background: var(--panel-bg); padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .screen.active { display: flex; flex-direction: column; gap: 16px; }

    .chat-container { width: 100%; max-width: 650px; height: 90vh; background: var(--panel-bg); border-radius: 12px; overflow: hidden; display: none; flex-direction: column; }
    .chat-container.active { display: flex; }

    .header { background: var(--primary-gradient); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .header-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #3558d0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; }

    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message-row { display: flex; gap: 8px; align-items: flex-end; }
    .message-row.sent { flex-direction: row-reverse; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
    .message.sent { background: var(--msg-out); border-bottom-right-radius: 2px; }
    .message.received { background: var(--msg-in); border-bottom-left-radius: 2px; }

    .input-area { display: flex; padding: 12px; background: #0e1621; gap: 8px; }
    input, button { padding: 12px; border: none; border-radius: 8px; outline: none; }
    input { background: var(--input-bg); color: #fff; flex: 1; }
    input[type="file"] { display: none; }
    button { background: var(--primary-gradient); color: #fff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #242f3d; }
    
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 8px; }
    .tab-buttons button { flex: 1; }
    .avatar-preview-container { text-align: center; }
    .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; cursor: pointer; border: 2px dashed #b83bde; display: block; }
  </style>
</head>
<body>

  <!-- Экран Входа / Регистрации -->
  <div id="authScreen" class="screen active">
    <h2 style="text-align:center;">Wallchat</h2>
    <div class="tab-buttons">
      <button id="tabLoginBtn" onclick="toggleAuthTab('login')">Вход</button>
      <button id="tabRegBtn" class="secondary" onclick="toggleAuthTab('register')">Регистрация</button>
    </div>
    
    <div class="avatar-preview-container" id="regAvatarBlock" style="display:none;">
      <img id="regAvatarPreview" class="avatar-preview" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="Аватар">
      <label for="regAvatarInput" style="cursor:pointer; font-size: 0.85rem; color: #b83bde;">Выбрать аватар из галереи</label>
      <input type="file" id="regAvatarInput" accept="image/*" onchange="previewImage(this, 'regAvatarPreview')">
    </div>

    <input type="text" id="authUsername" placeholder="Имя пользователя">
    <input type="password" id="authPassword" placeholder="Пароль">
    <button id="authSubmitBtn" onclick="submitAuth()">Войти</button>
  </div>

  <!-- Экран Настроек -->
  <div id="settingsScreen" class="screen">
    <h2>Настройки профиля</h2>
    <div class="avatar-preview-container">
      <img id="settingsAvatarPreview" class="avatar-preview" src="" alt="Аватар">
      <label for="settingsAvatarInput" style="cursor:pointer; font-size: 0.85rem; color: #b83bde;">Сменить аватар</label>
      <input type="file" id="settingsAvatarInput" accept="image/*" onchange="previewImage(this, 'settingsAvatarPreview')">
    </div>
    <input type="password" id="settingsNewPassword" placeholder="Новый пароль (опционально)">
    <button onclick="saveSettings()">Сохранить</button>
    <button class="secondary" onclick="showScreen('chatContainer')">Назад к чату</button>
    <button class="secondary" style="background:#d32f2f;" onclick="logout()">Выйти из аккаунта</button>
  </div>

  <!-- Главный Чат -->
  <div id="chatContainer" class="chat-container">
    <div class="header">
      <span style="font-size: 1.2rem;">Wallchat</span>
      <div class="header-user" onclick="showScreen('settingsScreen')">
        <span id="headerUsername">User</span>
        <img id="headerAvatar" class="avatar" src="" style="display:none;">
        <div id="headerAvatarPlaceholder" class="avatar">U</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <form class="input-area" id="form">
      <input id="input" autocomplete="off" placeholder="Напишите сообщение..." />
      <button type="submit">Отправить</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentMode = 'login';
    let currentUser = JSON.parse(localStorage.getItem('wallchat_user') || 'null');
    let tempBase64Avatar = '';

    function showScreen(id) {
      document.querySelectorAll('.screen, .chat-container').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'settingsScreen' && currentUser) {
        document.getElementById('settingsAvatarPreview').src = currentUser.avatar || '';
      }
    }

    function toggleAuthTab(mode) {
      currentMode = mode;
      document.getElementById('regAvatarBlock').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('tabLoginBtn').className = mode === 'login' ? '' : 'secondary';
      document.getElementById('tabRegBtn').className = mode === 'register' ? '' : 'secondary';
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
    }

    function previewImage(input, previewId) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById(previewId).src = e.target.result;
          tempBase64Avatar = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function submitAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!username || !password) return alert('Заполните поля');

      const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';
      const body = { username, password, avatar: currentMode === 'register' ? tempBase64Avatar : undefined };

      const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();

      if (res.ok) {
        currentUser = data;
        localStorage.setItem('wallchat_user', JSON.stringify(data));
        initChat();
      } else {
        alert(data.error);
      }
    }

    async function saveSettings() {
      const newPassword = document.getElementById('settingsNewPassword').value.trim();
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token: currentUser.token, avatar: tempBase64Avatar || currentUser.avatar, newPassword })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser.avatar = data.avatar;
        localStorage.setItem('wallchat_user', JSON.stringify(currentUser));
        alert('Настройки сохранены');
        initChat();
      }
    }

    function logout() {
      localStorage.removeItem('wallchat_user');
      currentUser = null;
      showScreen('authScreen');
    }

    function initChat() {
      if (!currentUser) return showScreen('authScreen');
      document.getElementById('headerUsername').textContent = currentUser.username;
      if (currentUser.avatar) {
        document.getElementById('headerAvatar').src = currentUser.avatar;
        document.getElementById('headerAvatar').style.display = 'block';
        document.getElementById('headerAvatarPlaceholder').style.display = 'none';
      } else {
        document.getElementById('headerAvatarPlaceholder').textContent = currentUser.username[0];
        document.getElementById('headerAvatar').style.display = 'none';
        document.getElementById('headerAvatarPlaceholder').style.display = 'flex';
      }
      showScreen('chatContainer');
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      if (input.value.trim() && currentUser) {
        socket.emit('chat message', { user: currentUser.username, text: input.value, avatar: currentUser.avatar });
        input.value = '';
      }
    });

    socket.on('chat message', (msg) => {
      const isMe = msg.user === currentUser?.username;
      const row = document.createElement('div');
      row.className = `message-row ${isMe ? 'sent' : 'received'}`;

      const avatarEl = msg.avatar 
        ? `<img class="avatar" src="${msg.avatar}">` 
        : `<div class="avatar">${msg.user[0]}</div>`;

      row.innerHTML = `
        ${avatarEl}
        <div class="message ${isMe ? 'sent' : 'received'}">
          <div style="font-size: 0.75rem; opacity: 0.7; margin-bottom: 2px;">${msg.user}</div>
          <div>${msg.text}</div>
        </div>
      `;
      
      const messages = document.getElementById('messages');
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    });

    if (currentUser) initChat();
  </script>
</body>
</html>
